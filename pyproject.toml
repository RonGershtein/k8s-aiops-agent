[project]
name = "k8s-aiops-agent"
version = "0.1.0"
description = "An AI agent that investigates a Kubernetes cluster, finds the root cause, and recommends a safe next action."
readme = "README.md"
authors = [
    { name = "RonGershtein", email = "talmor3003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: needs a running kind cluster"]
