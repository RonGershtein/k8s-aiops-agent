# Pods are healthy, but the Service selects app=frontend-v2 while pods are labeled app=frontend,
# so the Service has no endpoints. This is the scenario the agent may remediate (with approval).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: scenario-03
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, tier: web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: scenario-03
spec:
  selector: {app: frontend-v2}
  ports: [{port: 80, targetPort: 80}]
