# Held-out scenario: never used while tuning the prompt. The deployment references a ConfigMap
# that was never created, so the container cannot be created at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: scenario-05
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: orders
          image: busybox:1.36
          command: [sh, -c, "echo orders ready; while true; do sleep 3600; done"]
          envFrom: [{configMapRef: {name: orders-config}}]
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {memory: 32Mi}
