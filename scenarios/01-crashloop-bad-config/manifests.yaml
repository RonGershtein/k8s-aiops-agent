# Multi-source scenario: pod state shows CrashLoopBackOff, the previous logs show a config parse error,
# and only the ConfigMap shows the bad value ("30s" where integer milliseconds are expected).
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: scenario-01
data:
  PAYMENT_TIMEOUT_MS: "30s"
  PAYMENT_PROVIDER_URL: http://payments.internal:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: scenario-01
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          envFrom: [{configMapRef: {name: checkout-config}}]
          command: [sh, -c]
          args:
            - |
              echo "checkout v1.4.2 starting"
              echo "loading configuration from environment"
              case "$PAYMENT_TIMEOUT_MS" in
                ''|*[!0-9]*)
                  echo "FATAL config: PAYMENT_TIMEOUT_MS=\"$PAYMENT_TIMEOUT_MS\" is not a valid integer number of milliseconds"
                  exit 1 ;;
              esac
              echo "ready"; while true; do sleep 3600; done
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {memory: 32Mi}
