# Pods run fine but never become Ready: the readiness probe targets 8080/healthz while nginx serves on 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: scenario-02
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: scenario-02
spec:
  selector: {app: catalog}
  ports: [{port: 80, targetPort: 80}]
